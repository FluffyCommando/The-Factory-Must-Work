plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.89'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    flatDir { dirs 'libs' }
}

base {
    archivesName = mod_archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {

    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc1.21.1")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // Registrate -- TFMG's own registration library. Needed at compile
    // time to resolve the generic return types of its BlockEntry/
    // FluidEntry/etc. wrappers (e.g. TFMGFluids.CRUDE_OIL.get()); TFMG
    // already carries the real thing at runtime, so compileOnly avoids
    // bundling or shadowing it ourselves.
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")

    // TFMG:CE, as a plain jar dropped into /libs.
    implementation fileTree(dir: 'libs', include: ['tfmg*.jar'])

    // Sable Companion -- TFMG:CE's own Sable API, needed at compile time for SurfaceScannerSable.
    compileOnly fileTree(dir: 'libs', include: ['sable-companion*.jar'])

    // Pollution of the Realms (modid "adpother") -- a plain jar dropped
    // into /libs nessisary for building but optional when uning the mod.
	// Adds additional features to TFMG when using Pollution of the Realms.
    compileOnly fileTree(dir: 'libs', include: ['AdPother*.jar', 'adpother*.jar'])

    // ForgeEndertech -- Required dependency for Pollution of the Realms.
    compileOnly fileTree(dir: 'libs', include: ['ForgeEndertech*.jar', 'forgeendertech*.jar'])
}

var tfmgJars = fileTree(dir: 'libs', include: ['tfmg*.jar']).files
if (tfmgJars.isEmpty()) {
    throw new GradleException(
        "No TFMG:CE jar found in /libs (expected a file matching tfmg*.jar).\n" +
        "Copy your TFMG:CE jar (e.g. tfmg-1.21.1-1.3.2-community.jar) from your instance's mods folder into ${projectDir}/libs and re-run."
    )
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
