plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.89'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // TFMG (and any other mod jars you build against) live here as plain files.
    flatDir { dirs 'libs' }
}

base {
    archivesName = mod_archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {

    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.blamejared.com" } // JEI
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc1.21.1")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // Same artifact TFMG itself depends on (as `implementation`, i.e. a hard
    // requirement -- TFMG won't load without JEI present either way), but
    // compileOnly here since we don't need to bundle/redistribute it, just
    // resolve mezz.jei.* types at compile time. JEI itself comes along with
    // TFMG (or the user's own instance) at runtime.
    compileOnly("mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}")

    // TFMG itself, as a plain jar dropped into /libs (see README).
    // ModDev auto-detects the mods.toml inside it and loads it as a real mod
    // in dev runs, so mixins/accessors targeting its classes work normally.
    // Matched by filename pattern (tfmg*.jar) rather than an exact name so a
    // version bump on your end doesn't silently break the build.
    implementation fileTree(dir: 'libs', include: ['tfmg*.jar'])

    // Sable Companion -- a lightweight, stable API for optional Sable
    // compatibility (see SurfaceScannerBlockEntityMixin), extracted directly
    // from a real Sable jar's own embedded jarjar dependency rather than a
    // guessed Maven coordinate. compileOnly (not implementation) since this
    // is genuinely optional: Sable itself bundles this same library and
    // provides it at runtime for anyone who actually has Sable installed --
    // we only need its classes to compile against, never to bundle or load
    // as our own mod.
    compileOnly fileTree(dir: 'libs', include: ['sable-companion*.jar'])
}

var tfmgJars = fileTree(dir: 'libs', include: ['tfmg*.jar']).files
if (tfmgJars.isEmpty()) {
    throw new GradleException(
        "No TFMG jar found in /libs (expected a file matching tfmg*.jar).\n" +
        "Copy your tfmg-*.jar from your instance's mods folder into ${projectDir}/libs and re-run."
    )
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
